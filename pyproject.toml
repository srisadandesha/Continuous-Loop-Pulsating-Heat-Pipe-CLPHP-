[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clphp"
version = "0.1.0"
description = "Continuous-Loop Pulsating Heat Pipe (CLPHP) Hybrid Mathematical & PI-RNN Framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "CLPHP Research Team" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "coolprop>=6.4.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
clphp = "clphp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
